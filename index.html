<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Advanced - Week 4</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <h1>JavaScript Advanced - Week 4</h1>

        <!-- Question 1 -->
        <section class="card">
            <h2>1. Local Storage</h2>

            <input
                type="text"
                id="username"
                placeholder="Enter your name"
            >

            <button id="saveNameBtn">
                Save Name
            </button>

            <p id="displayName"></p>
        </section>


        <!-- Question 2 -->
        <section class="card">
            <h2>2. Email Validation</h2>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
            >

            <button id="validateEmailBtn">
                Validate Email
            </button>

            <p id="emailMessage"></p>
        </section>


        <!-- Question 3 -->
        <section class="card">
            <h2>3. Fetch Data from API</h2>

            <button id="quoteBtn">
                Get Random Quote
            </button>

            <div id="quote"></div>
        </section>


        <!-- Question 4 -->
        <section class="card">
            <h2>4. Arrow Function & Filter</h2>

            <p>
                <strong>Original Array:</strong>
                <span id="originalArray"></span>
            </p>

            <button id="filterBtn">
                Filter Numbers Greater Than 50
            </button>

            <p>
                <strong>Result:</strong>
                <span id="filteredArray"></span>
            </p>
        </section>

    </div>

    <script src="js/script.js"></script>

</body>
</html>
